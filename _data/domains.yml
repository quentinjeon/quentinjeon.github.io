# AX Insight 도메인 버티컬.
# 글이 실제로 있는 도메인만 등록한다. (준비 중 도메인은 노출하지 않음)
# 새 도메인 추가 절차:
#   1) 여기에 항목 추가
#   2) _pages/ax-<slug>.md 생성 (기존 파일 복사 후 domain 값만 교체)
#   3) 포스트 front matter 에 categories: [ax, <slug>]
ax:
  - slug: construction
    name: 건설
    icon: "🏗"
    tagline: "지식허브·법무·시공기준·고객여정·입찰 Risk — 건설사 업무를 Find에서 Act까지 잇는 구조"
    intro: >-
      건설사에서 AX를 시작할 때 가장 먼저 나오는 요구는 대개 "사내 문서를 검색하는 챗봇"입니다. 그런데 현장의 실제 문제는 문서를 못 찾는 것이 아니라, 찾은 다음에
      무엇을 해야 하는지가 사람의 경험에 묶여 있다는 쪽에 가깝습니다. 시방서와 법규를 찾아도 이번 현장에 적용할 수 있는지는 별도의 판단이고, 하자 민원이 들어와도 책임
      소재와 처리 절차는 담당자마다 다릅니다. 그래서 이 도메인의 글은 지식 검색을 끝이 아니라 출발점으로 두고, 지식허브·법무·시공기준·고객여정·입찰 리스크라는 다섯
      갈래로 업무를 나눈 뒤 각 갈래가 어디서 사람의 확정을 받아야 하는지를 설계하는 쪽을 다룹니다.
  - slug: energy
    name: 에너지
    icon: "⚡"
    tagline: "설비·안전·열수급·기한·현장을 하나의 업무 흐름으로 묶는 운영지능 구조"
    intro: >-
      에너지·플랜트 현장은 설비 상태, 작업 허가, 열 수급, 법정 기한, 현장 위치 정보가 서로 다른 시스템에 흩어져 있습니다. 담당자는 하루의 상당 시간을 "지금
      무엇이 급한가"를 다시 조립하는 데 씁니다. 이 상태에서 챗봇을 먼저 올리면 질문에는 답하지만 판단은 여전히 사람 머릿속에 남습니다. 이 도메인의 글은 그 앞단을
      다룹니다. 흩어진 데이터를 업무 상태로 묶고, 기한과 위험도에 따라 우선순위를 만들고, 작업 허가처럼 되돌리기 어려운 행동에는 승인 지점을 두는 구조입니다. 안전과
      규제가 걸린 영역이라 자동화 수준을 업무마다 다르게 잡는 것이 핵심입니다.
  - slug: commerce
    name: 커머스·광고
    icon: "🛒"
    tagline: "검색·쇼핑·피드·커뮤니티로 흩어진 고객 접점을 하나의 최적화 단위로 묶는 구조"
    intro: >-
      커머스와 광고에서 고객 접점은 검색, 쇼핑, 피드, 커뮤니티, 지도, 결제로 흩어져 있습니다. 각 접점이 다른 팀, 다른 지표, 다른 대행사로 관리되다 보니 같은
      고객을 두고 서로 다른 최적화가 동시에 돌아갑니다. 이 도메인의 글은 광고상품 목록에서 시작하지 않고 노출 표면에서 시작합니다. 어떤 질문이 어떤 화면에서
      소비되는지를 먼저 그리고, 그 표면 위에서 상품·콘텐츠·데이터를 어떻게 맞출지를 정리합니다. AI 검색이 끼어들면서 노출 표면 자체가 바뀌고 있다는 점도 함께
      다룹니다.
  - slug: foundation
    name: 파운데이션
    icon: "🧱"
    tagline: "도메인을 가리지 않는 AX 공통 구조 — Agent Workspace, 오케스트레이션, 거버넌스"
    intro: >-
      도메인을 가리지 않고 반복되는 구조를 모아 둔 곳입니다. 업무를 Task와 Decision으로 쪼개는 방법, RAG 파이프라인이 실제로 깨지는 지점, 에이전트의
      상태와 허용된 행동을 나누는 방식, 사람의 확정을 어디에 둘지, 권한과 감사 이력을 어떻게 남길지 같은 것들입니다. 어느 산업에서 시작하든 결국 같은 질문에 도달하기
      때문에, 산업별 글보다 이쪽을 먼저 읽는 편이 빠릅니다.

