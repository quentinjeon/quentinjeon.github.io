<!-- start custom head snippets -->
<style>
/* ── Medium식 목록 행 (프로젝트 · AX 포스팅 공용) ──────────────────
   테마 기본 폰트가 크고 .page__content p 의 margin 이 특이도에서 이기므로
   px 절대값 + .postrow 접두사로 특이도를 올려 고정한다. */
.postrow{border-bottom:1px solid #ececee;padding:18px 0}
.postrow:last-of-type{border-bottom:none}
.postrow .postrow__link{display:flex;gap:22px;align-items:flex-start;text-decoration:none!important;color:inherit}
.postrow .postrow__body{flex:1;min-width:0}
.postrow .postrow__meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
      font-size:12px;line-height:1.5;color:#8b939c;margin:0 0 7px}
.postrow .postrow__title{font-size:17px;line-height:1.4;font-weight:800;margin:0 0 5px;
      word-break:keep-all;color:#1b1f24}
.postrow .postrow__link:hover .postrow__title{color:#1a4b8c}
.postrow .postrow__desc{font-size:13.5px;line-height:1.6;color:#6b7280;margin:0 0 9px;word-break:keep-all;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.postrow .postrow__tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;line-height:1}
.postrow .postrow__tags span{font-size:11px;line-height:1.6;color:#5b6470;background:#f3f4f6;
      padding:3px 9px;border-radius:99px;white-space:nowrap}
.postrow .card__domain{font-size:11px;line-height:1.6;font-weight:700;padding:3px 9px;border-radius:99px;
      background:#e8f0fe;color:#1a4b8c;white-space:nowrap}
.postrow .postrow__thumb{order:-1;flex:0 0 248px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#eceef1}
.postrow .postrow__thumb img{width:100%;height:100%;object-fit:cover;display:block;margin:0}
.postrow .postrow__thumb--text{display:flex;align-items:center;justify-content:center;padding:8px;
      background:linear-gradient(135deg,#16243b 0%,#284066 100%)}
.postrow .postrow__thumb--text span{color:#fff;font-weight:700;font-size:15px;line-height:1.35;
      text-align:center;word-break:keep-all}
@media (max-width:600px){
  .postrow .postrow__link{gap:13px}
  .postrow .postrow__thumb{flex-basis:112px}
  .postrow .postrow__title{font-size:15px}
  .postrow .postrow__desc{display:none}
}

/* ── Scholar Labs: 내 산출물 vs 외부 저작물 구분 ─────────────────── */
.badge{display:inline-block;font-size:12px;line-height:1.6;font-weight:700;padding:3px 9px;
      border-radius:99px;white-space:nowrap;vertical-align:middle}
.badge--original{background:#e7f6ec;color:#1a7f3c;border:1px solid #bfe6cd}
.badge--external{background:#f4f4f5;color:#5b6470;border:1px solid #e0e2e5}
.readitem{border-left:3px solid #e0e2e5;padding:2px 0 2px 16px;margin:0 0 20px}
.readitem .readitem__title{font-size:16px;line-height:1.45;font-weight:700;word-break:keep-all;margin:0}
.readitem .readitem__authors{font-size:13px;line-height:1.5;color:#6b7280;margin:3px 0 5px}
.readitem .readitem__why{font-size:14px;line-height:1.6;color:#4b5563;margin:0;word-break:keep-all}

/* ── 글타래 내비 ─────────────────────────────────────────────── */
.seriesnav{border:1px solid #dfe3e8;border-left:4px solid #1a4b8c;border-radius:6px;
      background:#f8fafc;padding:14px 18px;margin:0 0 28px}
.seriesnav .seriesnav__label{font-size:12px;font-weight:700;letter-spacing:.02em;
      color:#1a4b8c;margin:0 0 8px;text-transform:none}
.seriesnav .seriesnav__list{list-style:none;margin:0;padding:0}
.seriesnav .seriesnav__list li{font-size:14px;line-height:1.55;margin:0 0 5px;padding:0;
      display:flex;gap:8px;align-items:baseline;word-break:keep-all}
.seriesnav .seriesnav__list li:last-child{margin-bottom:0}
.seriesnav .seriesnav__num{flex:0 0 34px;font-size:12px;font-weight:700;color:#8b939c}
.seriesnav .is-current .seriesnav__num{color:#1a4b8c}
.seriesnav .is-planned{opacity:.6}
.seriesnav .seriesnav__here{font-size:11px;color:#1a4b8c;background:#e8f0fe;
      padding:2px 7px;border-radius:99px;white-space:nowrap}
.seriesnav .seriesnav__soon{font-size:11px;color:#8b939c;background:#eef0f2;
      padding:2px 7px;border-radius:99px;white-space:nowrap}

/* ── 뉴스레터 구독 박스 ─────────────────────────────── */
.nlbox{border:1px solid #e0e2e5;border-radius:10px;padding:1.4em 1.5em;margin:2.5em 0 1em;
      background:linear-gradient(180deg,#f8fafc 0%,#fff 60%)}
.nlbox__eyebrow{font-size:.72em;font-weight:700;letter-spacing:.08em;color:#1a4b8c;
      text-transform:uppercase;margin:0 0 .25em}
.nlbox__title{font-size:1.18em;font-weight:800;line-height:1.4;margin:0 0 .3em;color:#1b1f24;word-break:keep-all}
.nlbox__desc{font-size:.88em;color:#5b6470;line-height:1.6;margin:0 0 1.1em;word-break:keep-all}
.nlbox__row{display:flex;gap:.8em;flex-wrap:wrap;margin-bottom:.8em}
.nlbox__field{flex:1 1 220px;display:flex;flex-direction:column;gap:.3em}
.nlbox__field>span{font-size:.78em;font-weight:700;color:#4b5563}
.nlbox__field b{color:#c2410c}
.nlbox__field i{font-style:normal;font-weight:400;color:#8b939c}
.nlbox__field input{width:100%;padding:.62em .75em;font-size:.92em;border:1px solid #d5d9de;
      border-radius:6px;background:#fff;color:#1b1f24}
.nlbox__field input:focus{outline:2px solid #1a4b8c;outline-offset:1px;border-color:#1a4b8c}
.nlbox__consent{display:flex;gap:.55em;align-items:flex-start;font-size:.84em;color:#4b5563;
      line-height:1.55;margin-bottom:1em;cursor:pointer;word-break:keep-all}
.nlbox__consent input{margin-top:.22em;flex:0 0 auto;width:15px;height:15px}
.nlbox__consent b{color:#c2410c;font-weight:700}
.nlbox__consent i{font-style:normal;font-weight:700;color:#8b939c}
.nlbox__consent+.nlbox__consent{margin-top:-.5em}
.nlbox__consent a{text-decoration:underline}
.nlbox__hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.nldom{border:0;padding:0;margin:0 0 1em;min-width:0}
.nldom__legend{padding:0;font-size:.78em;font-weight:700;color:#4b5563;margin-bottom:.45em}
.nldom__legend i{font-style:normal;font-weight:400;color:#8b939c}
.nldom__opts{display:flex;flex-wrap:wrap;gap:.4em}
.nldom__chip{position:relative;cursor:pointer}
.nldom__chip input{position:absolute;opacity:0;width:0;height:0}
.nldom__chip span{display:block;padding:.38em .85em;font-size:.82em;font-weight:600;color:#5b6470;
  border:1px solid #d5d9de;border-radius:999px;background:#fff;transition:.12s;white-space:nowrap}
.nldom__chip span:hover{border-color:#9aa3ad;color:#4b5563}
.nldom__chip input:checked+span{background:#1a4b8c;border-color:#1a4b8c;color:#fff}
.nldom__chip input:focus-visible+span{outline:2px solid #1a4b8c;outline-offset:2px}
.nldom__hint{font-size:.76em;color:#8b939c;margin:.5em 0 0}
.nldom__hint b{font-weight:700;color:#5b6470}
.nlbox__submit{padding:.62em 1.5em;font-size:.92em;font-weight:700;border:0;border-radius:6px;
      background:#1a4b8c;color:#fff;cursor:pointer}
.nlbox__submit:hover{background:#15407a}
.nlbox__submit[disabled]{background:#9aa3ad;cursor:default}
.nlbox__msg{font-size:.85em;margin:.7em 0 0;min-height:1.2em;line-height:1.5}
.nlbox__msg.is-ok{color:#1a7f3c}
.nlbox__msg.is-err{color:#c2410c}
.nlbox__pending{font-size:.88em;color:#5b6470;margin:0}
@media (max-width:600px){ .nlbox{padding:1.2em} .nlbox__row{gap:.6em} }

/* 읽는 중 구독 팝업 */
.nlpop{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.nlpop[hidden]{display:none}
.nlpop__dim{position:absolute;inset:0;background:rgba(11,17,25,.55)}
.nlpop__card{position:relative;width:100%;max-width:420px;background:#fff;border-radius:12px;
  padding:1.7em 1.6em 1.3em;box-shadow:0 18px 50px rgba(11,17,25,.28);animation:nlpop-in .22s ease-out;
  /* 세로가 짧은 창에서 카드가 잘려 닫기 버튼에 닿지 못하는 것을 막는다 */
  max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto}
@keyframes nlpop-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.nlpop__x{position:absolute;top:.35em;right:.5em;width:1.9em;height:1.9em;padding:0;border:0;
  background:none;color:#8b939c;font-size:1.35em;line-height:1;cursor:pointer;border-radius:6px}
.nlpop__x:hover{background:#f1f3f5;color:#4b5563}
.nlpop__title{font-size:1.28em;font-weight:800;line-height:1.35;margin:0 0 .35em;color:#1b1f24;word-break:keep-all}
.nlpop__desc{font-size:.9em;color:#5b6470;line-height:1.6;margin:0 0 1.2em;word-break:keep-all}
.nlpop__field{display:flex;flex-direction:column;gap:.3em;margin-bottom:.9em}
.nlpop__label{font-size:.78em;font-weight:700;color:#4b5563}
.nlpop__field input{width:100%;padding:.68em .8em;font-size:.95em;border:1px solid #d5d9de;
  border-radius:6px;background:#fff;color:#1b1f24}
.nlpop__field input:focus{outline:2px solid #1a4b8c;outline-offset:1px;border-color:#1a4b8c}
.nlpop__submit{width:100%;margin-top:.2em}
.nlpop__later{display:block;width:100%;margin-top:.5em;padding:.5em;border:0;background:none;
  font-size:.82em;color:#8b939c;cursor:pointer;text-decoration:underline}
.nlpop__later:hover{color:#5b6470}
@media (max-width:600px){
  .nlpop{align-items:flex-end;padding:0}
  .nlpop__card{max-width:none;border-radius:14px 14px 0 0;padding:1.5em 1.3em 1.1em;
    max-height:88vh;max-height:88dvh}
  @keyframes nlpop-in{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){ .nlpop__card{animation:none} }
</style>
<!-- end custom head snippets -->
