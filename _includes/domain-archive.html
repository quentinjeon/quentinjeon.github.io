{% assign d = include.domain %}
{% assign posts = site.categories[d.slug] %}
<p class="page__lead">{{ d.tagline }}</p>

{% if posts and posts.size > 0 %}
  {% for post in posts %}
    {% include archive-single.html post=post type="list" %}
  {% endfor %}
{% else %}
  <p>아직 이 도메인에 발행한 글이 없습니다.</p>
{% endif %}
